<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Documento | Portal Fraga Bike Shop</title>
<link rel="icon" type="image/png" href="assets/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css?v=7">
</head>
<body data-page="documentos">
<div class="overlay-scrim" id="scrim"></div>
<div class="app-shell">
  <aside class="sidebar" id="sidebar"></aside>
  <div class="main-col">
    <header class="topbar" id="topbar"></header>
    <main class="content" id="content" style="max-width:1180px;">
      <a href="documentos.html" class="btn btn-ghost btn-sm" style="margin-bottom:20px;display:inline-flex;">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><polyline points="15 18 9 12 15 6"/></svg>
        Voltar para documentos
      </a>

      <div id="docRoot"></div>
    </main>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/app.js?v=7"></script>
<script>
  const session = Fraga.init('documentos');
  if (session) {
    const { $, el, icon, state, formatDate } = Fraga;

    (async () => {
    const DOCS = await state.docsVisibleTo(session);
    const doc = DOCS.find((d) => d.id === Fraga.qs('id')) || DOCS[0];

    if (!doc) {
      $('#docRoot').appendChild(el('div', { class: 'empty-state' },
        icon('file'),
        el('p', {}, 'Nenhum documento disponível.')
      ));
    } else {
      document.title = doc.title + ' | Portal Fraga Bike Shop';
      let isRead = await state.isDocRead(doc.id);

      function renderMarkAsReadBtn() {
        const label = isRead ? 'Lido' : 'Marcar como lido';
        const btn = el('button', { class: 'btn ' + (isRead ? 'btn-ghost' : 'btn-success'), html: icon('check') + '<span>' + label + '</span>' });
        if (isRead) btn.setAttribute('disabled', 'true');
        btn.addEventListener('click', async () => {
          await state.markDocRead(doc.id);
          isRead = true;
          Fraga.toast('Documento marcado como lido.');
          Fraga.mountShell('documentos');
          root.replaceChildren(build());
        });
        return btn;
      }

      function build() {
        const wrap = el('div', { class: 'doc-layout' });

        const metaCol = el('div', { class: 'doc-meta-col' },
          el('div', {},
            el('div', { class: 'badge badge-outline', style: 'margin-bottom:10px;' }, doc.category),
            el('div', { class: 'doc-title' }, doc.title)
          ),
          el('div', { class: 'meta-item' }, el('div', { class: 'k' }, 'Categoria'), el('div', { class: 'v' }, doc.category)),
          el('div', { class: 'meta-item' }, el('div', { class: 'k' }, 'Setor'), el('div', { class: 'v' }, doc.sector)),
          el('div', { class: 'meta-item' }, el('div', { class: 'k' }, 'Versão'), el('div', { class: 'v' }, doc.version)),
          el('div', { class: 'meta-item' }, el('div', { class: 'k' }, 'Atualizado em'), el('div', { class: 'v' }, formatDate(doc.updatedAt))),
          el('div', { class: 'meta-item' }, el('div', { class: 'k' }, 'Responsável'), el('div', { class: 'v' }, doc.owner))
        );

        const toolbar = el('div', { class: 'doc-toolbar' });
        const shareBtn = el('button', { class: 'btn btn-ghost btn-sm', html: icon('share') + '<span>Compartilhar</span>' });
        shareBtn.addEventListener('click', () => Fraga.toast('Link do documento copiado para a área de transferência.'));
        const dlBtn = doc.fileData
          ? el('a', { class: 'btn btn-ghost btn-sm', href: doc.fileData, download: doc.fileName || (doc.title + '.pdf'), target: '_blank', html: icon('download') + '<span>Baixar</span>' })
          : el('button', { class: 'btn btn-ghost btn-sm', html: icon('download') + '<span>Baixar</span>' });
        if (!doc.fileData) dlBtn.addEventListener('click', () => Fraga.toast('Nenhum arquivo foi anexado a este documento ainda.'));
        const expandBtn = el('button', { class: 'btn btn-ghost btn-sm', 'data-expand-btn': '', html: icon('maximize') + '<span>Expandir</span>' });
        expandBtn.addEventListener('click', () => {
          const isFull = wrap.classList.toggle('is-fullscreen');
          document.body.classList.toggle('doc-fullscreen-lock', isFull);
          expandBtn.innerHTML = icon(isFull ? 'minimize' : 'maximize') + '<span>' + (isFull ? 'Recolher' : 'Expandir') + '</span>';
        });
        toolbar.appendChild(shareBtn);
        toolbar.appendChild(dlBtn);
        toolbar.appendChild(expandBtn);
        toolbar.appendChild(renderMarkAsReadBtn());

        const ext = (doc.fileName || '').split('.').pop().toLowerCase();
        const isImage = ['png', 'jpg', 'jpeg', 'gif', 'webp', 'svg'].includes(ext);
        const isPdf = ext === 'pdf';
        let previewInner;
        if (doc.fileData && isImage) {
          previewInner = el('img', { src: doc.fileData, alt: doc.title, style: 'max-width:100%;max-height:100%;border-radius:10px;object-fit:contain;' });
        } else if (doc.fileData && isPdf) {
          previewInner = el('embed', { src: doc.fileData, type: 'application/pdf', style: 'width:100%;height:100%;min-height:320px;border-radius:10px;' });
        } else {
          previewInner = el('div', { class: 'doc-preview-box' },
            el('div', { html: icon('file') }),
            el('p', {}, doc.fileData ? 'Arquivo enviado' : 'Pré-visualização do documento (PDF)'),
            el('p', { style: 'font-size:12px;color:var(--ink-faint);' }, doc.fileName || (doc.title + '.pdf'))
          );
        }
        const preview = el('div', { class: 'doc-preview' }, previewInner);

        const mainCol = el('div', { class: 'doc-main-col' }, toolbar, preview);
        wrap.appendChild(metaCol);
        wrap.appendChild(mainCol);
        return wrap;
      }

      const root = $('#docRoot');
      root.appendChild(build());

      document.addEventListener('keydown', (e) => {
        if (e.key !== 'Escape') return;
        const full = root.querySelector('.doc-layout.is-fullscreen');
        if (full) full.querySelector('[data-expand-btn]').click();
      });

      // Auto mark-as-read after a short delay reading, mirroring real reading behaviour.
      if (!isRead) {
        setTimeout(async () => {
          await state.markDocRead(doc.id);
          isRead = true;
          Fraga.mountShell('documentos');
          root.replaceChildren(build());
        }, 4000);
      }
    }
    })();
  }
</script>
</body>
</html>
