<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Onboarding | Portal Fraga Bike Shop</title>
<link rel="icon" type="image/png" href="assets/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css?v=17">
</head>
<body data-page="onboarding">
<div class="overlay-scrim" id="scrim"></div>
<div class="app-shell">
  <aside class="sidebar" id="sidebar"></aside>
  <div class="main-col">
    <header class="topbar" id="topbar"></header>
    <main class="content" id="content">
      <div class="page-head">
        <span class="eyebrow">Onboarding</span>
        <h1 class="page-title">Bem-vindo(a) à Fraga Bike Shop</h1>
        <p class="page-sub" id="progressSub">Seu onboarding está 0% concluído</p>
      </div>

      <div class="progress-track" style="margin-bottom:36px;">
        <div class="progress-fill" id="progressFill" style="width:0%;"></div>
      </div>

      <div class="onb-topic-grid" id="topicGrid"></div>

      <div class="card card-pad" style="margin-top:8px;">
        <h3 style="font-size:16px;margin-bottom:18px;">Sua trilha de integração</h3>
        <div class="onb-checklist" id="checklist"></div>
      </div>
    </main>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/app.js?v=13"></script>
<script>
  const session = Fraga.init('onboarding');
  if (session) {
    const { $, el, icon, ONBOARDING_TOPICS, state } = Fraga;

    const topicGrid = $('#topicGrid');
    ONBOARDING_TOPICS.forEach((t) => {
      const card = el('div', { class: 'onb-topic', role: 'button', tabindex: '0' },
        el('div', { class: 'quick-icon tone-' + t.tone, html: icon(t.icon) }),
        el('h4', {}, t.label)
      );
      card.style.cursor = 'pointer';
      card.addEventListener('click', () => Fraga.toast('Abrindo conteúdo: ' + t.label));
      topicGrid.appendChild(card);
    });

    let stepDefs = [];
    function defFor(id) { return stepDefs.find((s) => s.id === id) || {}; }

    function mediaIconFor(type) {
      if (type === 'video') return 'play';
      if (type === 'image') return 'image';
      if (type === 'document') return 'file-text';
      return null;
    }

    function openStepDetail(def, cb) {
      const overlay = el('div', { class: 'confirm-overlay' });
      const closeBtn = el('button', { type: 'button', class: 'org-detail-close', 'aria-label': 'Fechar', html: icon('x') });

      let mediaEl = null;
      if (def.mediaUrl && def.mediaType === 'video') {
        mediaEl = el('div', { class: 'onb-detail-media' }, el('video', { src: def.mediaUrl, controls: '' }));
      } else if (def.mediaUrl && def.mediaType === 'image') {
        mediaEl = el('div', { class: 'onb-detail-media' }, el('img', { src: def.mediaUrl, alt: def.label }));
      } else if (def.mediaUrl) {
        mediaEl = el('div', { class: 'onb-detail-media' },
          el('a', { class: 'onb-detail-doc', href: def.mediaUrl, target: '_blank', rel: 'noopener', html: icon('file-text') + '<span>' + (def.mediaName || 'Abrir documento') + '</span>' })
        );
      }

      const doneBtn = el('button', { type: 'button', class: 'btn btn-block ' + (cb.checked ? 'btn-ghost' : 'btn-success'), html: icon('check') + '<span>' + (cb.checked ? 'Concluído' : 'Marcar como concluído') + '</span>' });
      doneBtn.disabled = cb.checked;
      doneBtn.addEventListener('click', () => {
        cb.click();
        doneBtn.disabled = true;
        doneBtn.className = 'btn btn-block btn-ghost';
        doneBtn.innerHTML = icon('check') + '<span>Concluído</span>';
      });

      const card = el('div', { class: 'onb-detail-card' },
        closeBtn,
        el('h3', {}, def.label || ''),
        el('div', { class: 'onb-detail-sector' }, def.sector === 'Todos' ? 'Todos os setores' : def.sector),
        def.description ? el('p', { class: 'onb-detail-desc' }, def.description) : '',
        mediaEl || '',
        doneBtn
      );
      overlay.appendChild(card);
      document.body.appendChild(overlay);
      document.body.classList.add('confirm-lock');
      requestAnimationFrame(() => overlay.classList.add('show'));

      function close() {
        document.removeEventListener('keydown', onKey);
        overlay.classList.remove('show');
        document.body.classList.remove('confirm-lock');
        setTimeout(() => overlay.remove(), 200);
      }
      function onKey(e) { if (e.key === 'Escape') close(); }
      closeBtn.addEventListener('click', close);
      overlay.addEventListener('click', (e) => { if (e.target === overlay) close(); });
      document.addEventListener('keydown', onKey);
    }

    async function renderProgress() {
      const pct = await state.onboardingProgress(session);
      $('#progressFill').style.width = pct + '%';
      $('#progressSub').textContent = 'Seu onboarding está ' + pct + '% concluído' + (pct === 100 ? ' 🎉' : '');
    }

    async function renderChecklist() {
      const list = $('#checklist');
      list.innerHTML = '<div class="empty-state"><p>Carregando...</p></div>';
      stepDefs = await state.onboardingStepsFor(session);
      const steps = await state.onboardingSteps(session);
      list.innerHTML = '';
      if (!steps.length) {
        list.appendChild(el('div', { class: 'empty-state' }, el('p', {}, 'Nenhuma etapa de onboarding cadastrada ainda.')));
        return;
      }
      steps.forEach((step) => {
        const def = defFor(step.id);
        const cb = document.createElement('input');
        cb.type = 'checkbox';
        cb.checked = step.done;
        const box = el('span', { class: 'box', html: icon('check') });
        const mediaIcon = mediaIconFor(def.mediaType);
        const row = el('div', { class: 'onb-check' },
          cb, box,
          el('span', { class: 'label' }, def.label || ''),
          mediaIcon ? el('span', { class: 'onb-media-badge', html: icon(mediaIcon) }) : '',
          el('span', { class: 'onb-open-hint', html: icon('chevron-right') })
        );
        cb.addEventListener('click', (e) => e.stopPropagation());
        cb.addEventListener('change', async () => {
          cb.disabled = true;
          await state.toggleOnboardingStep(step.id, session);
          cb.disabled = false;
          renderProgress();
          if (cb.checked) Fraga.toast('Etapa concluída: ' + (def.label || ''));
        });
        box.addEventListener('click', (e) => { e.stopPropagation(); cb.click(); });
        row.addEventListener('click', () => openStepDetail(def, cb));
        list.appendChild(row);
      });
    }

    renderProgress();
    renderChecklist();
  }
</script>
</body>
</html>
