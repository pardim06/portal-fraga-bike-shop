<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Onboarding | Portal Fraga Bike Shop</title>
<link rel="icon" type="image/png" href="assets/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css?v=20">
</head>
<body data-page="onboarding">
<div class="overlay-scrim" id="scrim"></div>
<div class="app-shell">
  <aside class="sidebar" id="sidebar"></aside>
  <div class="main-col">
    <header class="topbar" id="topbar"></header>
    <main class="content" id="content">
      <div class="page-head">
        <span class="eyebrow">Onboarding</span>
        <h1 class="page-title">Bem-vindo(a) à Fraga Bike Shop</h1>
        <p class="page-sub" id="progressSub">Seu onboarding está 0% concluído</p>
      </div>

      <div class="progress-track" style="margin-bottom:36px;">
        <div class="progress-fill" id="progressFill" style="width:0%;"></div>
      </div>

      <div class="onb-topic-grid" id="topicGrid"></div>

      <div class="card card-pad" style="margin-top:8px;">
        <h3 style="font-size:16px;margin-bottom:18px;">Treinamentos do seu setor</h3>
        <div class="onb-carousel-wrap">
          <button class="onb-carousel-arrow" type="button" id="onbPrev" aria-label="Treinamento anterior">
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><polyline points="15 18 9 12 15 6"/></svg>
          </button>
          <div class="onb-carousel-track" id="checklist"></div>
          <button class="onb-carousel-arrow" type="button" id="onbNext" aria-label="Próximo treinamento">
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><polyline points="9 18 15 12 9 6"/></svg>
          </button>
        </div>
        <div class="onb-carousel-dots" id="onbDots"></div>
      </div>
    </main>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/app.js?v=14"></script>
<script>
  const session = Fraga.init('onboarding');
  if (session) {
    const { $, el, icon, ONBOARDING_TOPICS, state } = Fraga;

    const topicGrid = $('#topicGrid');
    ONBOARDING_TOPICS.forEach((t) => {
      const card = el('div', { class: 'onb-topic', role: 'button', tabindex: '0' },
        el('div', { class: 'quick-icon tone-' + t.tone, html: icon(t.icon) }),
        el('h4', {}, t.label)
      );
      card.style.cursor = 'pointer';
      card.addEventListener('click', () => Fraga.toast('Abrindo conteúdo: ' + t.label));
      topicGrid.appendChild(card);
    });

    let stepDefs = [];
    function defFor(id) { return stepDefs.find((s) => s.id === id) || {}; }

    function mediaIconFor(type) {
      if (type === 'video') return 'play';
      if (type === 'image') return 'image';
      if (type === 'document') return 'file-text';
      return null;
    }

    function openStepDetail(step) {
      location.href = 'treinamento.html?id=' + step.id;
    }

    async function renderProgress() {
      const pct = await state.onboardingProgress(session);
      $('#progressFill').style.width = pct + '%';
      $('#progressSub').textContent = 'Seu onboarding está ' + pct + '% concluído' + (pct === 100 ? ' 🎉' : '');
    }

    /* Carousel controls: arrows scroll one viewport width, dots reflect
       the nearest scroll-snapped page. */
    const track = $('#checklist');
    const prevBtn = $('#onbPrev');
    const nextBtn = $('#onbNext');
    const dotsWrap = $('#onbDots');

    function refreshCarouselControls() {
      const width = Math.max(track.clientWidth, 1);
      const pages = Math.max(1, Math.round(track.scrollWidth / width));
      const current = Math.min(pages - 1, Math.round(track.scrollLeft / width));
      dotsWrap.innerHTML = '';
      const hasOverflow = pages > 1;
      dotsWrap.hidden = !hasOverflow;
      prevBtn.hidden = !hasOverflow;
      nextBtn.hidden = !hasOverflow;
      if (hasOverflow) {
        for (let i = 0; i < pages; i++) dotsWrap.appendChild(el('span', { class: 'dot' + (i === current ? ' is-active' : '') }));
        prevBtn.disabled = track.scrollLeft <= 4;
        nextBtn.disabled = track.scrollLeft >= track.scrollWidth - width - 4;
      }
    }
    prevBtn.addEventListener('click', () => track.scrollBy({ left: -track.clientWidth, behavior: 'smooth' }));
    nextBtn.addEventListener('click', () => track.scrollBy({ left: track.clientWidth, behavior: 'smooth' }));
    let scrollTimer;
    track.addEventListener('scroll', () => { clearTimeout(scrollTimer); scrollTimer = setTimeout(refreshCarouselControls, 80); });
    window.addEventListener('resize', refreshCarouselControls);

    async function renderChecklist() {
      track.innerHTML = '<div class="empty-state"><p>Carregando...</p></div>';
      stepDefs = await state.onboardingStepsFor(session);
      const steps = await state.onboardingSteps(session);
      track.innerHTML = '';
      track.scrollLeft = 0;
      if (!steps.length) {
        track.appendChild(el('div', { class: 'empty-state' }, el('p', {}, 'Nenhum treinamento cadastrado para o seu setor ainda.')));
        prevBtn.hidden = true;
        nextBtn.hidden = true;
        dotsWrap.hidden = true;
        return;
      }
      steps.forEach((step) => {
        const def = defFor(step.id);
        const mediaIcon = mediaIconFor(def.mediaType);
        const pct = step.done ? 100 : 0;
        const openBtn = el('button', { type: 'button', class: 'btn btn-primary btn-sm btn-block onb-card-btn' },
          step.done ? 'Revisar treinamento' : 'Acessar treinamento');
        const cardEl = el('div', { class: 'onb-card' },
          el('span', { class: 'onb-card-tag' + (step.done ? ' is-done' : '') },
            def.sector === 'Todos' ? 'Todos os setores' : def.sector),
          el('div', { class: 'onb-card-title' }, def.label || '', mediaIcon ? el('span', { class: 'onb-card-media-icon', html: icon(mediaIcon) }) : ''),
          el('div', { class: 'onb-card-progress' },
            el('div', { class: 'track' }, el('div', { class: 'fill' + (step.done ? ' is-done' : ''), style: 'width:' + pct + '%;' })),
            el('span', { class: 'pct' }, pct + '%')
          ),
          openBtn
        );
        const open = () => openStepDetail(step);
        cardEl.addEventListener('click', open);
        openBtn.addEventListener('click', (e) => { e.stopPropagation(); open(); });
        track.appendChild(cardEl);
      });
      refreshCarouselControls();
    }

    renderProgress();
    renderChecklist();
  }
</script>
</body>
</html>
