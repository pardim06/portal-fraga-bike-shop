<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Entrar | Portal Fraga Bike Shop</title>
<link rel="icon" type="image/png" href="assets/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css?v=17">
</head>
<body style="background:var(--bg);">
<div class="login-wrap">
  <div class="login-card">
    <div class="login-brand">
      <svg class="brand-gear g1" viewBox="0 0 24 24" aria-hidden="true"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg>
      <svg class="brand-gear g2" viewBox="0 0 24 24" aria-hidden="true"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg>
      <div class="login-brand-content">
        <div class="logo-badge"><img src="assets/fraga-logo-mark.png?v=2" alt="Fraga Bike Shop"></div>
        <h2>Bem-vindo ao Portal Fraga</h2>
        <p>Conecte-se para acessar informações, documentos e recursos internos.</p>
      </div>
    </div>
    <div class="login-form-side">
      <h3>Acessar sua conta</h3>
      <p class="sub">Use seu e-mail corporativo para entrar.</p>
      <form id="loginForm" novalidate>
        <div class="field" id="emailField">
          <label for="email">E-mail</label>
          <input type="email" id="email" name="email" placeholder="colaborador@fragabikeshop.com.br" autocomplete="username" />
          <span class="error-msg">Informe um e-mail válido.</span>
        </div>
        <div class="field" id="passField">
          <label for="password">Senha</label>
          <div class="field-input-wrap">
            <input type="password" id="password" name="password" placeholder="••••••••" autocomplete="current-password" />
            <button type="button" class="field-toggle" id="togglePass" aria-label="Mostrar senha" aria-pressed="false">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><circle cx="12" cy="12" r="3" fill="none" stroke="currentColor" stroke-width="1.8"/></svg>
            </button>
          </div>
          <span class="error-msg">Informe sua senha.</span>
        </div>
        <div class="login-row">
          <label class="checkline"><input type="checkbox" id="remember" checked /> Lembrar acesso</label>
          <a href="#" id="forgotLink">Esqueci minha senha</a>
        </div>
        <button type="submit" class="btn btn-primary btn-block btn-submit" id="submitBtn" data-state="idle">
          <span class="btn-label">Entrar no Portal</span>
          <span class="btn-spinner" aria-hidden="true"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><circle cx="12" cy="12" r="9" opacity="0.3"/><path d="M21 12a9 9 0 0 0-9-9"/></svg></span>
          <span class="btn-success" aria-hidden="true"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg> Bem-vindo!</span>
        </button>
      </form>
      <p class="auth-error" id="formError" hidden></p>
      <a href="admin-login.html" class="admin-entry-link">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
        Acesso administrativo
      </a>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/app.js?v=13"></script>
<script>
  Fraga.redirectIfAuthed('dashboard.html');

  const form = Fraga.$('#loginForm');
  const emailInput = Fraga.$('#email');
  const passInput = Fraga.$('#password');
  const submitBtn = Fraga.$('#submitBtn');
  const formError = Fraga.$('#formError');

  Fraga.$('#forgotLink').addEventListener('click', (e) => {
    e.preventDefault();
    Fraga.toast('Envie um e-mail para ti@fragabikeshop.com.br para redefinir sua senha.');
  });

  // Show/hide password
  const togglePass = Fraga.$('#togglePass');
  togglePass.addEventListener('click', () => {
    const showing = passInput.type === 'text';
    passInput.type = showing ? 'password' : 'text';
    togglePass.setAttribute('aria-pressed', String(!showing));
    togglePass.setAttribute('aria-label', showing ? 'Mostrar senha' : 'Ocultar senha');
    togglePass.innerHTML = showing
      ? '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><circle cx="12" cy="12" r="3" fill="none" stroke="currentColor" stroke-width="1.8"/></svg>'
      : '<svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>';
  });

  function shake(fieldEl) {
    fieldEl.classList.remove('shake');
    // eslint-disable-next-line no-unused-expressions
    fieldEl.offsetWidth; // restart the animation on repeated invalid submits
    fieldEl.classList.add('shake');
  }

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    if (submitBtn.dataset.state !== 'idle') return;

    formError.hidden = true;

    let ok = true;
    const emailValid = /.+@.+\..+/.test(emailInput.value.trim());
    Fraga.$('#emailField').classList.toggle('has-error', !emailValid);
    if (!emailValid) { shake(Fraga.$('#emailField')); ok = false; }

    const passValid = passInput.value.trim().length > 0;
    Fraga.$('#passField').classList.toggle('has-error', !passValid);
    if (!passValid) { shake(Fraga.$('#passField')); ok = false; }

    if (!ok) return;

    submitBtn.dataset.state = 'loading';

    const { data, error } = await Fraga.supabase.auth.signInWithPassword({
      email: emailInput.value.trim(),
      password: passInput.value,
    });

    if (error) {
      submitBtn.dataset.state = 'idle';
      formError.textContent = 'E-mail ou senha incorretos.';
      formError.hidden = false;
      shake(Fraga.$('#passField'));
      return;
    }

    const { data: profile, error: profileError } = await Fraga.supabase
      .from('profiles').select('*').eq('id', data.user.id).single();

    if (profileError || !profile) {
      submitBtn.dataset.state = 'idle';
      formError.textContent = 'Não encontramos um perfil para esta conta. Fale com o time de TI.';
      formError.hidden = false;
      await Fraga.supabase.auth.signOut();
      return;
    }

    submitBtn.dataset.state = 'success';
    Fraga.setSession({
      id: profile.id,
      name: profile.name,
      email: profile.email,
      role: profile.role,
      sector: profile.sector,
      since: profile.since,
      accessLevel: profile.access_level,
      avatarUrl: profile.avatar_url,
    });
    setTimeout(() => {
      const next = Fraga.qs('next');
      location.href = next && /^[\w-]+\.html$/.test(next) ? next : 'dashboard.html';
    }, 550);
  });
</script>
</body>
</html>
